<!DOCTYPE html>
<html lang="ru" data-theme="app">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Вход · Sales CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/crm.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230035AA'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Georgia' font-size='16' fill='%23fff'%3E26%3C/text%3E%3C/svg%3E">
</head>
<body>
<div class="login">
  <form class="login__box" id="f">
    <div class="login__logo"><svg viewBox="0 0 140 25" fill="none" aria-hidden="true"><rect x=".5" y=".5" width="24" height="24" rx="2" fill="currentColor"/><text x="12.5" y="17.5" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#FFFFFF">RE</text><text x="32" y="17" font-family="Georgia, serif" font-size="15" letter-spacing="2.5" fill="currentColor">ESTATE</text></svg><small class="muted" style="font:var(--text-label);letter-spacing:1px">CRM</small></div>
    <h1>Вход для застройщика</h1>
    <label class="field"><span class="field__label">Логин</span><input class="field__input" name="login" autocomplete="username" required></label>
    <label class="field"><span class="field__label">Пароль</span><input class="field__input" name="password" type="password" autocomplete="current-password" required></label>
    <p class="field__err" id="err" hidden></p>
    <button class="btn btn--primary" type="submit">Войти</button>
    <p class="muted" style="font:var(--text-caption)">Агенты входят по личной ссылке из Telegram, без пароля.</p>
  </form>
</div>
<script src="../js/crm.js"></script>
<script>
(function () {
  const f = document.getElementById('f'), err = document.getElementById('err');
  f.addEventListener('submit', async (e) => {
    e.preventDefault(); err.hidden = true;
    try { await CRM.api('/auth/login', { method: 'POST', body: { login: f.login.value, password: f.password.value } }); location.href = CRM.BASE + '/admin/'; }
    catch (x) { err.textContent = x.message; err.hidden = false; }
  });
})();
</script>
</body>
</html>
